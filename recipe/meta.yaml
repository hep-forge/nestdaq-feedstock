{% set versions = {
    "2026.10.20": "d0a66a13c916cd15345218dfd3cda537297252210cd2aa8b5897c917011527b6"
} %}
{% set version = environ.get('COMMIT_VERSION', None) %}
{% set version = (version or versions.keys()|first)|string %}

package:
  name: {{ environ.get('ANACONDA_PACKAGE', 'nestdaq')|string|lower }}
  version: {{ environ.get('ANACONDA_VERSION', version)|replace('-', '.') }}

source:
  # Dated snapshot of upstream main; not the older upstream v1.0.0 release.
  url: https://github.com/spadi-alliance/nestdaq/archive/eda728718362cc0ee169bea9b111ffc3fda7ca6b.tar.gz
  sha256: {{ versions[version] }}
  patches:
    - boost-compatibility.patch
    - portable-release-flags.patch
    - cli-help-success.patch
    - controller-library-discovery.patch

build:
  number: 2
  skip: true  # [not linux]
  run_exports:
    - {{ pin_subpackage("nestdaq", max_pin="x.x.x") }}

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
    - cmake >=3.26.5,<4
    - ninja
  host:
    - fairmq >=1.11,<1.12
    - fairlogger >=2.3,<3
    - libboost-devel !=1.88.*
    - fmt
    - libhiredis >=1.3,<1.4
    - redis-plus-plus >=1.3.15,<1.4
  run:
    - fairmq >=1.11,<1.12
    - fairlogger >=2.3,<3
    - libboost
    - libhiredis >=1.3,<1.4
    - redis-plus-plus >=1.3.15,<1.4

test:
  requires:
    - python
  files:
    - run_cli_smoke.py
  commands:
    - test -f "${PREFIX}/lib/libFairMQPlugin_daq_service.so"
    - test -f "${PREFIX}/lib/libFairMQPlugin_metrics.so"
    - test -f "${PREFIX}/lib/libFairMQPlugin_parameter_config.so"
    - test -f "${PREFIX}/lib/libFairMQPlugin_telemetry.so"
    - test -f "${PREFIX}/share/controller/daq-webctl.html"
    - python run_cli_smoke.py

about:
  home: https://github.com/spadi-alliance/nestdaq
  license: MIT
  license_file: LICENSE
  summary: Streaming data acquisition framework based on FairMQ and Redis
  description: |
    NestDAQ provides FairMQ plugins, example devices, and a web controller
    for streaming data acquisition. This package contains the application
    and plugins; Redis server and Redis Stack modules are separate runtime
    services and are not built by this recipe.
  dev_url: https://github.com/spadi-alliance/nestdaq

extra:
  recipe-maintainers:
    - gw2015tylerdurden
