# ROOT line shared with root-plus (published for root 6.38 only).
root:
  - 6.38

c_stdlib:
  - sysroot                    # [linux]
  - macosx_deployment_target   # [osx]
c_stdlib_version:              # [unix]
  - 2.17                       # [linux]
  # macOS 13.3: root-plus (kalman's Accelerate CBLAS) needs 13.3
  - 13.3                       # [osx]
c_compiler_version:    # [linux]
  - 16                         # [linux]
cxx_compiler_version:    # [linux]
  - 16                         # [linux]
# macOS: the clang ROOT is built with (root-feedstock pins 20).
c_compiler_version:    # [osx]
  - 20                         # [osx]
cxx_compiler_version:  # [osx]
  - 20                         # [osx]

# Keep smithy's generated variant metadata on the same channels as hep-forge CI.
channel_sources:
  - hep-forge,conda-forge
channel_targets:
  - hep-forge main

# Python is a CLI-test interpreter, not part of the C++ package's ABI.
python:
  - "3.12.* *_cpython"
# Override the paired global pin as well, so smithy keeps only Python 3.12.
is_python_min:
  - false

# conda-forge root_base variant (cxx20/cxx23 in its build string)
root_cxx_standard:
  - 23
