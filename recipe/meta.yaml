{% set versions = {
    "2026.10.20": "eda728718362cc0ee169bea9b111ffc3fda7ca6b"
} %}

{# nestdaq-user-impl and uhbook are built on top of nestdaq in the same
   package; each nestdaq version pins their commits too. "head" (or any
   version not listed) builds the upstream main of all three. #}
{% set user_impl = {
    "2026.10.20": "3dd6b69f9b3c37eaa6b97f11c11d0b659c5ab064"
} %}
{% set uhbook = {
    "2026.10.20": "e979eb28fb64de2eb216ebec31f73a6696d257ec"
} %}

{% set version = environ.get('COMMIT_VERSION', None) %}
{% set version = version or versions.keys()|first %}
{% set version = version|string %}

{% set name = environ.get('ANACONDA_PACKAGE', "nestdaq")|string|lower %}

package:
  name: {{ name }}
  version: {{ environ.get('ANACONDA_VERSION', version)|replace("-", ".") }}
{% set root_tag = (root or '')|replace('.', '') %}

source:
  - git_url: "https://github.com/spadi-alliance/nestdaq"
    git_rev: {{ versions.get(version, "HEAD") }}
    patches:
      # Boost.Process v1 compatibility, current Asio APIs, WebSocket
      # payloads copied through buffer_copy.
      - patches/nestdaq/boost-compatibility.patch
      # Keep conda's release flags instead of -march=native.
      - patches/nestdaq/portable-release-flags.patch
      # --help exits 0 before the controller starts its services.
      - patches/nestdaq/cli-help-success.patch
      # Locate the controller's Redis library with find_library.
      - patches/nestdaq/controller-library-discovery.patch

  - git_url: "https://github.com/spadi-alliance/nestdaq-user-impl"
    git_rev: {{ user_impl.get(version, "HEAD") }}
    folder: user-impl
    patches:
      # FairMQ >= 1.10 everywhere (upstream stops at 1.10.0, and at 1.8 in
      # LogicFilter/TriggerView), no -march=native, every executable in
      # bin/, internal static libraries and bundled sqlite not installed.
      - patches/user-impl/conda-build.patch

  - git_url: "https://github.com/spadi-alliance/uhbook"
    git_rev: {{ uhbook.get(version, "HEAD") }}
    folder: uhbook

build:
  number: 1
  string: "root{{ root_tag }}"
  skip: true  # [not linux]
  # No ROOT dictionaries yet, but this links against ROOT and could grow
  # one -- keep conda-build's prefix relocation away from lib/*.pcm, as
  # rapgap and xfitter do.
  ignore_prefix_files:
    - lib/*.pcm
  # max_pin computes an upper bound by incrementing the version, which
  # fails for "head"; pin the lower bound only (as root-plus does).
  run_exports:
    - {{ pin_subpackage(name, max_pin=None) }}

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
    - cmake >=3.26.5,<4
    - ninja
    - git

  host:
    - root {{ root }}.*
    - root-plus * *_root{{ root_tag }}
    - fairmq >=1.11,<1.12
    - fairlogger >=2.3,<3
    - libboost-devel !=1.88.*
    - fmt
    - libhiredis >=1.3,<1.4
    - redis-plus-plus >=1.3.15,<1.4
  run:
    - root {{ root }}.*
    - root-plus * *_root{{ root_tag }}
    - fairmq >=1.11,<1.12
    - fairlogger >=2.3,<3
    - libboost
    - libhiredis >=1.3,<1.4
    - redis-plus-plus >=1.3.15,<1.4

test:
  requires:
    - python
  files:
    - run_cli_smoke.py
  commands:
    # nestdaq plugins and controller
    - test -f "${PREFIX}/lib/libFairMQPlugin_daq_service.so"
    - test -f "${PREFIX}/lib/libFairMQPlugin_metrics.so"
    - test -f "${PREFIX}/lib/libFairMQPlugin_parameter_config.so"
    - test -f "${PREFIX}/lib/libFairMQPlugin_telemetry.so"
    - test -f "${PREFIX}/share/controller/daq-webctl.html"
    # nestdaq-user-impl devices and tools
    {% for exe in ["STFBuilder", "TimeFrameBuilder", "FileSink", "AmQStrTdcSampler", "TriggerView", "LogicFilter", "emulator", "tfdump"] %}
    - test -x "${PREFIX}/bin/{{ exe }}"
    {% endfor %}
    - test -f "${PREFIX}/include/uhbook/uhbook.cxx"
    - python run_cli_smoke.py

about:
  home: "https://github.com/spadi-alliance/nestdaq"
  license: "MIT"
  license_file:
    - LICENSE
    - user-impl/LICENSE
    - uhbook/LICENSE
  summary: "Streaming data acquisition framework based on FairMQ and Redis, with the SPADI user implementation"
  description: |
    NestDAQ provides FairMQ plugins, example devices and a web controller for
    streaming data acquisition. This package also builds nestdaq-user-impl on
    top of it (Sampler, Sink, FileSink, STFBuilder, TimeFrameBuilder, filters,
    TriggerView, emulator, ...; its Sampler and Sink replace the nestdaq
    examples, as in an upstream install) and ships the uhbook headers. ROOT
    and ROOT+ (root-plus) come from hep-forge. Redis server and Redis Stack
    modules are separate runtime services.
  dev_url: "https://github.com/spadi-alliance/nestdaq-user-impl"

extra:
  recipe-maintainers:
    - gw2015tylerdurden
    - meiyasan
