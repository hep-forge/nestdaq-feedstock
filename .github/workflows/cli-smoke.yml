name: CLI smoke tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  amd64:
    name: CLI smoke (AMD64)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/cli-smoke

  arm64:
    name: CLI smoke (ARM64)
    needs: amd64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/cli-smoke
